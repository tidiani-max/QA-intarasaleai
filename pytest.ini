[pytest]
addopts = -ra --alluredir=allure-results --tracing=retain-on-failure --screenshot=only-on-failure --video=retain-on-failure --output=test-artifacts
markers =
    smoke: fast critical-path checks, run on every PR
    regression: full suite, run on main/nightly
    api: API-level tests, no browser
    flaky: known-flaky, quarantined with a ticket (retried, tracked)
base_url = https://www.saucedemo.com
